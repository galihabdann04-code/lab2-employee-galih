<!-- templates/form.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        input {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        li {
            margin-bottom: 12px;
        }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        form[action="/employees/new"] button {
            background-color: #28a745;
        }
        a button {
            background-color: #ffa500;
        }
        form[action*="delete"] button {
            background-color: #dc3545;
        }
    </style>
    <title>Tambah Employee</title>
</head>
<body>
    <h2>Tambah Employee Baru</h2>
    <form action="/employees/new" method="POST">
        <label>Nama:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Posisi:</label><br>
        <input type="text" name="position"><br><br>

        <label>Gaji:</label><br>
        <input type="number" name="salary"><br><br>

        <button type="submit">Simpan</button>
    </form>

    <h3>Daftar Employee:</h3>
    <ul>
    {% for e in employees %}
    <li>
        {{ e.name }} - {{ e.position }} - Rp{{ e.salary }}
        <a href="/employees/{{ e.id }}/edit"><button type="button">Edit</button></a>
        <form action="/employees/{{ e.id }}/delete" method="POST" style="display:inline;">
            <button type="submit">Hapus</button>
        </form>
    </li>
    {% endfor %}
    </ul>
</body>
</html>
